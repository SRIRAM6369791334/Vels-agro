services:
  # Option 1: Render Static Site (Recommended: 100% Free, Zero Sleep, Fast Global CDN & Instant HTTPS)
  - type: web
    name: vels-agro-admin
    env: static
    buildCommand: npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
