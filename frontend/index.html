<!doctype html>
<!-- Vels — Admin Panel. Complete Editable Source -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vels — Admin Panel</title>
  <meta name="description" content="Vels is the inventory app of Marlow & Fern, a small skincare lab: stock across a warehouse, a lab and a shop, production batches with QA release and expiry dates, sales orders on a pick-pack-ship board, returns, purchase orders and suppliers, transfers and cycle counts, analytics, customers and settings — light and dark, fully animated." />
  <meta name="theme-color" content="#eef0ec" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Vels — Admin Panel" />
  <meta property="og:description" content="Stock, batches, orders and suppliers in one animated inventory dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..700&display=swap" rel="stylesheet" />
  <script>
    /* Before first paint: the saved theme and sidebar, so the page never
       flashes the wrong colours. */
    (function (d) {
      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('Vels:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          if (localStorage.getItem('Vels:side') === '1') d.classList.add('side-open');
          var a = localStorage.getItem('Vels:accent');
          if (a && /^(#|pine$|cobalt$|ocean$|graphite$)/.test(a)) d.dataset.accent = a.charAt(0) === '#' ? 'custom' : a;
          if (localStorage.getItem('Vels:signedout') === '1') d.classList.add('signed-out');
        }
      } catch (e) {}
      if (!rec) setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);
  </script>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/main.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app">
    <header class="top">
      <a class="brand" href="/dashboard/overview" aria-label="Vels Agro — dashboard">
        <span class="brand__mark" aria-hidden="true"><img src="/brand/vels_logo_512.png" alt="Vels Logo" class="brand__logo" /></span>
        <span class="brand__text">Vels<small>Agro Machinery</small></span>
      </a>
      <nav class="tabs" aria-label="Pages in this section">
        <div class="tabs__track" id="tabs"></div>
      </nav>
      <div class="top__tools">
        <button type="button" class="finder-btn" id="btn-find" aria-label="Search (⌘K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search</span><kbd>⌘K</kbd></button>
        <a class="ibtn ibtn--glass top__gear" href="/settings/account" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l2 2.1 2.9-.4.7 2.8 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.8-2.9-.4-2 2.1-2-2.1-2.9.4-.7-2.8-2.6-1.4 1-2.8-1-2.8 2.6-1.4.7-2.8 2.9.4Z"/></svg></a>
        <button type="button" class="ibtn ibtn--glass" id="btn-bell" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="dot-badge" id="bell-badge" hidden></span></button>
        <button type="button" class="btn btn--primary top__new magnetic" id="btn-new" aria-label="Create new" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
        <button type="button" class="me" id="btn-me" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>

    <aside class="rail" aria-label="Sidebar">
      <div class="theme-sw" role="group" aria-label="Theme">
        <span class="theme-sw__knob" aria-hidden="true"></span>
        <button type="button" class="theme-sw__btn" data-theme-to="light" aria-label="Light theme" aria-pressed="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button type="button" class="theme-sw__btn" data-theme-to="dark" aria-label="Dark theme" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg></button>
      </div>
      <nav class="nav" aria-label="Main">
        <div class="nav__track">
          <a class="nav__item" href="/dashboard/overview" data-route="dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Dashboard</span></a>
          <a class="nav__item" href="/categories/list" data-route="categories"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg><span>Categories</span></a>
          <a class="nav__item" href="/products/catalog" data-route="products"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="m3.5 7.5 8.5 4.5 8.5-4.5M12 12v9M7.7 5.2l8.6 4.6"/></svg><span>Products</span><b class="nav__count" data-count="products"></b></a>
          <a class="nav__item" href="/orders/all" data-route="orders"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3v14H6z"/><path d="M15 3.5v3h3"/><circle cx="11.5" cy="13" r="2.6"/><path d="m13.5 15 2 2"/></svg><span>Orders</span><b class="nav__count" data-count="orders"></b></a>
          <a class="nav__item" href="/purchasing/orders" data-route="purchasing"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2.2l2 10.5h10l2-7.5H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span>Purchasing</span></a>
          <a class="nav__item" href="/warehouses/locations" data-route="warehouses"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20V9l8.5-5 8.5 5v11"/><path d="M7 20v-7h10v7M7 16.5h10"/></svg><span>Warehouses</span></a>
          <a class="nav__item" href="/dealers/locations" data-route="dealers"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V7l8-4v18M13 10h4v11M9 10v2M9 15v2"/></svg><span>Dealers</span></a>
          <a class="nav__item" href="/promotions/coupons" data-route="promotions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span>Offers & Promos</span></a>
          <a class="nav__item" href="/analytics/overview" data-route="analytics"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5h15"/><path d="M7.5 16v-4.5M12 16V7.5M16.5 16v-6.5"/></svg><span>Analytics</span></a>
          <a class="nav__item" href="/customers/farmers" data-route="customers"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.8c1.8.6 3 2.2 3.5 4.7"/></svg><span>Customers</span></a>
          <a class="nav__item nav__item--extra" href="/settings/account" data-route="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l2 2.1 2.9-.4.7 2.8 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.8-2.9-.4-2 2.1-2-2.1-2.9.4-.7-2.8-2.6-1.4 1-2.8-1-2.8 2.6-1.4.7-2.8 2.9.4Z"/></svg><span>Settings</span></a>
          <button type="button" class="nav__item nav__more" aria-label="More pages" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg><span>More</span></button>
          <span class="nav__pill" aria-hidden="true"></span>
        </div>
      </nav>
      <div class="rail__foot">
        <a class="nav__item" href="/help/center" data-route="help"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.7M12 17h.01"/></svg><span>Help</span></a>
        <button type="button" class="nav__item" id="btn-out"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5h3.5A1.5 1.5 0 0 1 19 6v12a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M10 8.5 6.5 12l3.5 3.5M6.5 12H15"/></svg><span>Sign out</span></button>

      </div>
    </aside>

    <main id="main" class="main">
      <section class="view" data-view="login" hidden></section>
      <section class="view" data-view="dashboard" hidden></section>

      <section class="view" data-view="orders" hidden></section>
      <section class="view" data-view="purchasing" hidden></section>
      <section class="view" data-view="warehouses" hidden></section>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer"></div>

  <dialog class="finder" id="finder" aria-label="Search Vels">

      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="Product, SKU, lot, order, customer, supplier…" autocomplete="off" spellcheck="false" />

    </div>
    <ul class="finder__list" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal" id="modal"></dialog>
  <dialog class="drawer" id="drawer"></dialog>

  <div class="toast" role="status" aria-live="polite">
    <span class="toast__ico"></span><span class="toast__msg"></span>
    <button type="button" class="toast__undo" hidden>Undo</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
